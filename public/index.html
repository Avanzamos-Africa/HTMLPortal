<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Portal - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="auth-card">
      <h1>Task Portal</h1>
      <div id="error-message" class="error-message"></div>
      
      <div id="login-form" class="auth-form">
        <h2>Login</h2>
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="login-username">Username</label>
            <input type="text" id="login-username" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <p class="toggle-auth">
          Don't have an account? <a href="#" onclick="toggleAuthForm(event)">Register</a>
        </p>
      </div>
      
      <div id="register-form" class="auth-form" style="display: none;">
        <h2>Register</h2>
        <form onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="register-username">Username</label>
            <input type="text" id="register-username" required minlength="3" autocomplete="username">
            <small>At least 3 characters</small>
          </div>
          <div class="form-group">
            <label for="register-password">Password</label>
            <input type="password" id="register-password" required minlength="6" autocomplete="new-password">
            <small>At least 6 characters</small>
          </div>
          <button type="submit" class="btn btn-primary">Register</button>
        </form>
        <p class="toggle-auth">
          Already have an account? <a href="#" onclick="toggleAuthForm(event)">Login</a>
        </p>
      </div>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
